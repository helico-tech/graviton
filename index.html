<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Graviton</title>
    <link rel="icon" href="data:," />
    <script>
      // Installed before any module runs so a crash during bootstrap is still recorded.
      window.__gravitonErrors = [];
      addEventListener('error', (e) => window.__gravitonErrors.push('error: ' + e.message));
      addEventListener('unhandledrejection', (e) =>
        window.__gravitonErrors.push('unhandledrejection: ' + String(e.reason)),
      );
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
